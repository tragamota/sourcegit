name: Build
on:
  workflow_call:
jobs:
  build:
    strategy:
      matrix:
        include:
          - name: Windows x64
            os: windows-2022
            runtime: win-x64
          - name: Windows ARM64
            os: windows-2022
            runtime: win-arm64
          - name: Linux
            os: ubuntu-latest
            runtime: linux-x64
            container: registry.access.redhat.com/ubi8/ubi:8.10
          - name: Linux (arm64)
            os: ubuntu-24.04-arm
            runtime: linux-arm64
            container: registry.access.redhat.com/ubi8/ubi:8.10
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container || '' }}
    steps:
      - name: Install common CLI tools
        if: startsWith(matrix.runtime, 'linux-')
        run: |
          dnf install -y \
            binutils \
            ca-certificates \
            clang \
            curl \
            findutils \
            gcc \
            git \
            gzip \
            krb5-libs \
            libgcc \
            libicu \
            libstdc++-devel \
            openssl-libs \
            tar \
            tzdata \
            unzip \
            wget \
            zip \
            zlib \
            zlib-devel
          dnf clean all
      - name: Checkout sources
        uses: actions/checkout@v6
        with:
          submodules: true
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build -c Release
      - name: Publish
        run: dotnet publish src/SourceGit.csproj -c Release -o publish -r ${{ matrix.runtime }}
      - name: Verify glibc 2.28 compatibility
        if: startsWith(matrix.runtime, 'linux-')
        shell: bash
        run: |
          system_glibc="$(getconf GNU_LIBC_VERSION | awk '{print $2}')"
          if [[ "$system_glibc" != "2.28" ]]; then
            echo "Expected the Linux build container to use glibc 2.28, found $system_glibc" >&2
            exit 1
          fi

          max_glibc="$(readelf --version-info publish/SourceGit \
            | sed -n 's/.*Name: GLIBC_\([0-9.]*\).*/\1/p' \
            | sort -V \
            | tail -n 1)"
          if [[ -z "$max_glibc" ]]; then
            echo "Could not determine the glibc symbol versions required by SourceGit" >&2
            exit 1
          fi

          if [[ "$(printf '%s\n' "$max_glibc" '2.28' | sort -V | tail -n 1)" != "2.28" ]]; then
            echo "SourceGit requires glibc $max_glibc, which is newer than 2.28" >&2
            exit 1
          fi
          echo "Highest required glibc symbol version: $max_glibc (limit: 2.28)"
      - name: Rename executable file
        if: startsWith(matrix.runtime, 'linux-')
        run: mv publish/SourceGit publish/sourcegit
      - name: Tar artifact
        if: startsWith(matrix.runtime, 'linux-')
        run: |
          tar -cvf "sourcegit.${{ matrix.runtime }}.tar" -C publish .
          rm -r publish/*
          mv "sourcegit.${{ matrix.runtime }}.tar" publish
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: sourcegit.${{ matrix.runtime }}
          path: publish/*
