name: Release
on:
  push:
    tags:
      - v*
jobs:
  build:
    name: Build
    uses: ./.github/workflows/build.yml
  version:
    name: Prepare version string
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Output version string
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
  package:
    needs: [build, version]
    name: Package
    uses: ./.github/workflows/package.yml
    with:
      version: ${{ needs.version.outputs.version }}
  release:
    needs: [package, version]
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.version.outputs.version }}
        run: gh release create "$TAG" -t "$VERSION" --notes-from-tag
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: package.*
          path: release
          merge-multiple: true
      - name: Verify Linux release assets
        shell: bash
        run: |
          mapfile -t appimages < <(find release -maxdepth 1 -type f -name '*.AppImage' -print)
          mapfile -t rpms < <(find release -maxdepth 1 -type f -name '*.rpm' -print)

          if (( ${#appimages[@]} == 0 )); then
            echo "No AppImage was found in the release folder" >&2
            exit 1
          fi
          if (( ${#rpms[@]} == 0 )); then
            echo "No RPM was found in the release folder" >&2
            exit 1
          fi

          printf 'AppImage release assets:\n%s\n' "${appimages[*]}"
          printf 'RPM release assets:\n%s\n' "${rpms[*]}"
      - name: Upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "$TAG" release/*
